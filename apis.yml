aid: autone
name: autone
description: 'autone is an AI-powered inventory management platform for retail brands, blending
  machine-driven recommendations with merchandising expertise and a brand''s own data to optimize
  stock decisions across buying, reordering, replenishment, and rebalancing. Its modules — Buy,
  Reorder, Replenish, Rebalance, Assortment & Initial Allocation, and Insights — help fashion,
  beauty, furniture, and sports retailers reduce stockouts and overstock, redistribute inventory
  across locations, and improve margins. Founded by supply-chain operators from luxury fashion
  houses (Alexander McQueen, Victoria Beckham, Givenchy), autone is backed by General Catalyst,
  Seedcamp, and Speedinvest. No public developer API or documentation is published at this time;
  the platform is delivered as an enterprise SaaS. This profile originated as a VC-portfolio lead
  and has been enriched with verifiable company identity and domain-security signals.'
